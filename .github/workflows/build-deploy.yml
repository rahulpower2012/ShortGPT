name: Build and Deploy

on:
  push:
    branches: [ ShortGPT-with-azure ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight UTC

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_INSTANCE_NAME: ${{ secrets.CONTAINER_INSTANCE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shortgpt-on-azure:latest
            ghcr.io/shortgpt-on-azure:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container Instance
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az container restart \
              --name ${{ env.CONTAINER_INSTANCE_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Azure Logout
        run: az logout
